[project]
name = "switch2pro-connector"
version = "1.0.0"
description = "One-click Nintendo Switch 2 Pro Controller Connector for Windows (USB-C & Bluetooth)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "hidapi>=0.14.0",
    "bleak>=0.21.0",
    "customtkinter>=5.2.0",
    "pillow>=10.0.0",
    "pywin32>=306",
    "pyyaml>=6.0.1",
    "setuptools>=68.0.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

